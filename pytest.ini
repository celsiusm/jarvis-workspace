[pytest]
# Minimal config so `pytest` (no args) runs the backend suite consistently.
# There was no config before: plotspace/AGENTS.md said "doesn't use pytest" while
# CLAUDE.md/QA did — this pins pytest as the official runner.
# Tests remain runnable as standalone scripts (__main__ block).
testpaths = plotspace/tests
python_files = test_*.py
python_functions = test_*
addopts = -q
