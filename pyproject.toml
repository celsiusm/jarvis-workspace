[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-workspace"
# Single source of version = the VERSION file (the same one the engine reads at
# runtime, see plotspace/routers/system.py). It is resolved below, in
# [tool.setuptools.dynamic]; never hardcode it here or it drifts.
dynamic = ["version"]
description = "Jarvis Workspace — your fleet of coding agents, in one app"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jarvis Workspace contributors" }]
keywords = ["ai", "agents", "terminal", "claude", "codex", "orchestration"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

# The MINIMUM to start and work. Everything heavy goes in extras: without that, a
# `pip install .` downloads 1.3 GB for someone who may never use local dictation
# or the remote browser. Mirror of packaging/requirements-base.txt, which is what
# ships in the installer.
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "websockets>=12.0",
  "httptools>=0.6.0",
  "aiofiles>=23.0.0",
  "python-multipart>=0.0.6",
  "anthropic>=0.100.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "edge-tts>=6.0.0",
  # LISTEN ports, cwd and process cmdline: replaces `ss` and reading /proc,
  # neither of which exists outside Linux.
  "psutil>=5.9.0",
  # Unix only (pulls in pty/termios/fcntl). On Windows the terminal engine is
  # termhost and this package is not needed.
  "ptyprocess>=0.7.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
# Dictation with the model running on your machine. With STT_MOTOR=groq dictation
# is remote and none of this is needed.
voice = ["onnx-asr[cpu,hub]>=0.11", "numpy>=1.24.0"]
# Escape hatch for local dictation (STT_MOTOR=whisper).
whisper = ["faster-whisper>=1.1.0", "numpy>=1.24.0"]
# Web Preview remote browser: for sites that block iframes.
# Besides the package you must download the browser: `playwright install chromium`.
browser = ["playwright>=1.50.0", "Pillow>=10.0.0"]
all = ["jarvis-workspace[voice,browser]"]

[project.urls]
Homepage = "https://github.com/celsiusm/jarvis-workspace"
Issues = "https://github.com/celsiusm/jarvis-workspace/issues"

[project.scripts]
jarvis = "plotspace.cli:main"

[tool.setuptools]
# The package is named like the product. `frontend/` stays as a sibling, not
# inside: moving it would change every relative path in the repo for no gain today
# (the installer picks it up anyway, see packaging/armar_bundle.py).
packages = ["plotspace", "plotspace.core", "plotspace.routers"]
include-package-data = true

[tool.setuptools.package-data]
plotspace = ["../frontend/**/*"]

[tool.setuptools.dynamic]
# The version comes from the VERSION file via plotspace.__version__ (which reads it
# and strips the trailing \n). A single source of truth, impossible to diverge.
version = { attr = "plotspace.__version__" }
