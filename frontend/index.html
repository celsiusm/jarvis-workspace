<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Workspace</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/shared/favicon.svg?v=1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/shared/apple-touch-icon.png?v=1">
  <!-- PWA: Jarvis instalable como app standalone (sin chrome del navegador ni ✕ de fullscreen). -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d12">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/shared/tokens.css?v=18">
  <link rel="stylesheet" href="/static/sections/home/home.css?v=17">
</head>
<body>
<script src="/static/shared/themes.js?v=9"></script>
<script src="/static/shared/escala.js?v=4"></script>
<script>window.JarvisThemes?.init?.(); window.JarvisEscala?.init?.();</script>

<!-- Background atmospheric layer (fijo, no afecta layout).
     .atmosphere-strands: cintas de luz WebGL detrás del hero (shared/strands.js);
     si no hay WebGL2 queda solo la aurora estática de CSS. -->
<div class="atmosphere" aria-hidden="true"><div class="atmosphere-strands" id="atmo-strands"></div></div>

<div class="home">

  <!-- ═══ TOP BAR (52px) ═══════════════════════════════════════ -->
  <header class="hc-top">
    <div class="hc-brand">
      <span class="hc-mark" aria-hidden="true" title="Jarvis">
        <svg viewBox="0 0 64 64" fill="none">
          <defs><linearGradient id="hc-brand-cinta" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#5b3fd6"/><stop offset=".55" stop-color="#7c5cff"/><stop offset="1" stop-color="#b9a6ff"/>
          </linearGradient></defs>
          <path d="M12 46 L24 35 L32 41 L50 15" stroke="rgba(124,92,255,.35)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="blur(4px)"/>
          <path d="M12 46 L24 35 L32 41 L50 15" stroke="url(#hc-brand-cinta)" stroke-width="7" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="5"/>
          <path d="M12 46 L24 35 L32 41 L50 15" stroke="rgba(255,255,255,.38)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-0.7,-1.6)"/>
          <circle cx="12" cy="46" r="3.4" fill="#4a30b8"/><circle cx="12" cy="46" r="1.6" fill="#c9bcff"/>
          <circle cx="24" cy="35" r="1.7" fill="#2c1e63"/><circle cx="32" cy="41" r="1.7" fill="#2c1e63"/>
          <circle cx="50" cy="15" r="7.5" fill="rgba(185,166,255,.3)"/><circle cx="50" cy="15" r="3.4" fill="#fff"/>
          <g stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M50 5.5 V9.5"/><path d="M50 20.5 V24.5"/><path d="M40.5 15 H44.5"/><path d="M55.5 15 H59.5"/></g>
        </svg>
      </span>
      <span class="hc-brand-name">Jarvis</span>
      <span class="hc-brand-divider">·</span>
      <span class="hc-brand-sub">Workspace</span>
    </div>

    <div class="hc-actions">
      <span class="hc-host" id="hc-host">localhost:3000</span>
      <button class="hc-cta" id="btn-new-project" type="button">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="7" y1="2.5" x2="7" y2="11.5"/>
          <line x1="2.5" y1="7" x2="11.5" y2="7"/>
        </svg>
        <span>Nuevo proyecto</span>
      </button>
    </div>
  </header>

  <!-- ═══ MAIN (centro 1280px max) ═══════════════════════════ -->
  <main class="hc-main">

    <!-- Hero compacto: 1 línea -->
    <div class="hc-hero">
      <h1 class="hc-hero-name" id="hc-greeting">Buenas tardes.</h1>
      <div class="hc-hero-stats" id="hc-hero-stats">
        <span><b id="stat-projects">0</b> proyectos</span>
        <span class="hc-stat-dot">·</span>
        <span class="live"><b id="stat-agents">0</b> agentes activos</span>
      </div>
    </div>

    <!-- Toolbar: search + filtros -->
    <div class="hc-toolbar">
      <div class="hc-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="hc-search-input"
               placeholder="Buscar proyecto, branch o ruta…"
               autocomplete="off" spellcheck="false" aria-label="Buscar proyectos">
        <span class="hc-kbd">⌘K</span>
      </div>

      <div class="hc-filters" id="hc-filters" role="tablist">
        <button class="hc-filter activo" data-filter="all" role="tab">
          Todos <span class="hc-filter-count" data-count="all">0</span>
        </button>
        <button class="hc-filter" data-filter="pinned" role="tab">
          Anclados <span class="hc-filter-count" data-count="pinned">0</span>
        </button>
        <button class="hc-filter" data-filter="active" role="tab">
          Activos <span class="hc-filter-count" data-count="active">0</span>
        </button>
        <button class="hc-filter" data-filter="archived" role="tab">
          Archivados <span class="hc-filter-count" data-count="archived">0</span>
        </button>
      </div>
    </div>

    <!-- Grid de proyectos (cards generadas por JS) -->
    <div class="hc-grid" id="hc-grid" data-i18n-skip></div>

    <!-- Empty state (visible si no hay proyectos) -->
    <div class="hc-empty" id="hc-empty">
      <span class="hc-empty-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <defs><linearGradient id="hc-empty-cinta" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#5b3fd6"/><stop offset=".55" stop-color="#7c5cff"/><stop offset="1" stop-color="#b9a6ff"/>
          </linearGradient></defs>
          <path d="M12 46 L24 35 L32 41 L50 15" stroke="rgba(124,92,255,.35)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="blur(4px)"/>
          <path d="M12 46 L24 35 L32 41 L50 15" stroke="url(#hc-empty-cinta)" stroke-width="7" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="5"/>
          <path d="M12 46 L24 35 L32 41 L50 15" stroke="rgba(255,255,255,.38)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-0.7,-1.6)"/>
          <circle cx="12" cy="46" r="3.4" fill="#4a30b8"/><circle cx="12" cy="46" r="1.6" fill="#c9bcff"/>
          <circle cx="24" cy="35" r="1.7" fill="#2c1e63"/><circle cx="32" cy="41" r="1.7" fill="#2c1e63"/>
          <circle cx="50" cy="15" r="7.5" fill="rgba(185,166,255,.3)"/><circle cx="50" cy="15" r="3.4" fill="#fff"/>
          <g stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M50 5.5 V9.5"/><path d="M50 20.5 V24.5"/><path d="M40.5 15 H44.5"/><path d="M55.5 15 H59.5"/></g>
        </svg>
      </span>
      <h2 class="hc-empty-title">Tu console está vacía.</h2>
      <p class="hc-empty-text">
        Conectá tu primera carpeta para empezar a orquestar agentes de IA en paralelo.
      </p>
      <button class="hc-cta" id="btn-new-project-empty" type="button">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="7" y1="2.5" x2="7" y2="11.5"/>
          <line x1="2.5" y1="7" x2="11.5" y2="7"/>
        </svg>
        <span>Nuevo proyecto</span>
      </button>
    </div>

  </main>

</div>


<script src="/static/shared/ui.js?v=15"></script>
<script src="/static/shared/i18n.js?v=4"></script>
<script src="/static/shared/i18n-dict.js?v=30"></script>
<script src="/static/shared/strands.js?v=1"></script>
<script src="/static/sections/home/bienvenida.js?v=3"></script>
<script src="/static/sections/home/home.js?v=17"></script>
<!-- Chrome de ventana de la APP (Jarvis.exe): minimizar/maximizar/cerrar, F11 y
     arrastre. La app ATERRIZA acá, no en el workspace — sin esto la ventana
     quedaba sin botones y sin poder moverse hasta entrar a un proyecto. En un
     browser normal el módulo es no-op (no existe window.__shell). -->
<script src="/static/shell/window-chrome.js?v=5"></script>
</body>
</html>
