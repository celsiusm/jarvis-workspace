# Jarvis Workspace — local orchestration with Docker Compose.
#
# Usage:
#   cp .env.example .env      # edit PROYECTOS_DIR (and optionally the API key)
#   docker compose up -d --build
#   docker compose logs -f
#   # open http://localhost:3000
#
# (compose v2: no `version:` key, it is deprecated)

services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis-workspace:latest
    container_name: jarvis-workspace
    # init=true → a PID 1 that reaps zombies. Jarvis spawns MANY subprocesses
    # (tmux, git, node, chromium, ffmpeg); without an init they pile up as defunct.
    init: true
    restart: unless-stopped
    # Chromium crashes with Docker's default /dev/shm (64 MB). 1 GB is roomy.
    shm_size: "1gb"
    ports:
      # With Docker Desktop, port mapping DOES work even on WSL (it solves the
      # pain of WSL not forwarding new ports to Windows). host:container.
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # 1) Container HOME (named volume) → the agent CLIs' AUTH
      #    (~/.claude, ~/.config, CODEX_HOME, etc.). The user links their
      #    accounts FROM the UI (⚙ → Accounts, login in a PTY); they persist
      #    across restarts. The host's ~/.claude is NOT mounted: auth lives only
      #    in this volume.
      - jarvis_home:/root
      # 2) Local app state (SQLite jarvis.db + remote
      #    browser profile + account secrets). Bound to ./data so you can
      #    see/back it up from the host. It auto-creates and bootstraps empty.
      - ./data:/app/data
      # 3) The user's PROJECTS directory (their code). Configurable via the
      #    PROYECTOS_DIR env var in .env. INSIDE the container it lives at
      #    /proyectos → when creating a project in the UI, use paths like
      #    /proyectos/my-app. Default ./proyectos if not set.
      - ${PROYECTOS_DIR:-./proyectos}:/proyectos
    healthcheck:
      # /api/health is an OPEN route (no token). Generous start_period because of
      # startup (Whisper preload, tmux reconciliation, etc.).
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  jarvis_home:
